<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- CSP (spec 125.23). connect-src = the origin(s) of the Supabase URLs in config.mjs. Before the upload to fredstudy.github.io:
     put the cloud origin of config.mjs SITE.url here and drop the local http://127.0.0.1:54321 (admin.test.mjs checks they agree). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://fredstudy.github.io/admin/ https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js; connect-src https://fxfzehltyribnxzmpnrv.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>לומו · לוח ניהול</title>
<style>
:root{
  --bg:#f6f7f5; --panel:#ffffff; --ink:#15201c; --ink-2:#4c5953; --ink-3:#7d8983; --line:#dfe4e1; --soft:#eef1ef;
  --accent:#1f6f5c; --accent-soft:#dcefe8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#1d7a3a; --good-bg:#e3f3e7; --warn:#a45f00; --warn-bg:#fdf0d9; --bad:#b42323; --bad-bg:#fbe4e2;
  --f-body:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-num:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111614; --panel:#18201d; --ink:#e9efec; --ink-2:#b5c0bb; --ink-3:#86928c; --line:#2b3632; --soft:#202a26;
  --accent:#5cc3a6; --accent-soft:#1e3b33;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good:#6fd08e; --good-bg:#1b3324; --warn:#f0b45a; --warn-bg:#3a2c14; --bad:#f08a84; --bad-bg:#3e1d1b;
  color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 60px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
h3{font-size:15px;margin:0;font-weight:600}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dhead .t{font-weight:700;font-size:18px}
.dhead .side{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.badge{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-bg);border:1px dashed var(--warn);padding:2px 9px;border-radius:999px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 12px;cursor:pointer}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
@media (max-width:480px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start;min-width:0}
.tile .lbl{font-size:12.5px;color:var(--ink-2)}
.tile .val{font-size:24px;font-weight:600}
@media (max-width:480px){.tile .val{font-size:20px}}
.delta{font-size:12px;font-weight:600}
.up-bad{color:var(--bad)} .up-good{color:var(--good)} .flat{color:var(--ink-3)}
.tile .sub{font-size:11.5px;color:var(--ink-3)}
.tile svg{width:100%;height:30px;display:block}
.alerts{display:grid;gap:6px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;font-size:13.5px}
.alert b{font-weight:700}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert .ic{font-weight:700;font-family:var(--f-num)}
.alert .small{opacity:.9}
.card{grid-template-columns:minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0;align-content:start}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font-size:14px;background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--ink-3);font-weight:500;font-size:12px}
td.n,th.n{text-align:left;font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr}
tr.total td{font-weight:700;border-top:2px solid var(--ink-3)}
.neg{color:var(--bad)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-num)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:crosshair}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.keys span{display:inline-flex;align-items:center;gap:5px}
.keys i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hbar{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:minmax(70px,120px) 1fr 70px;gap:8px;align-items:center;font-size:12.5px}
.hrow .tr{background:var(--soft);border-radius:4px;height:12px;overflow:hidden}
.hrow .fl{height:100%;background:var(--s1);border-radius:4px}
.hrow .v{text-align:left}
.small{font-size:12px;color:var(--ink-3)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--soft);border-radius:8px;padding:6px 10px}
.soon{display:grid;gap:4px}
.soon div{font-size:13px;color:var(--ink-2);border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.soon b{color:var(--ink-3);font-weight:600}
.fixed input,.fixed select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%;min-width:70px}
.center{padding:60px 16px;text-align:center;display:grid;gap:10px;justify-items:center}
.center h2{margin:0}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;white-space:pre;font-family:var(--f-num);direction:rtl;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="wrap" id="root"><noscript>הלוח דורש JavaScript.</noscript></div>
<div id="tip" hidden></div>

</html>
